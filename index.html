    <!-- Cloudflare Web Analytics -->
    <script>
      (() => {
        const disableAnalyticsKey = "gt_disable_cloudflare_analytics";
        const queryParams = new URLSearchParams(window.location.search);

        if (queryParams.get("analytics") === "off") {
          window.localStorage.setItem(disableAnalyticsKey, "true");
          return;
        }

        if (queryParams.get("analytics") === "on") {
          window.localStorage.removeItem(disableAnalyticsKey);
        }

        if (window.localStorage.getItem(disableAnalyticsKey) === "true") {
          return;
        }

        const script = document.createElement("script");
        script.type = "module";
        script.src = "https://static.cloudflareinsights.com/beacon.min.js";
        script.dataset.cfBeacon =
          '{"token": "8ffd6f1e3b5a4a689d52dd1e3d163422"}';
        document.body.appendChild(script);
      })();
    </script>
    <!-- End Cloudflare Web Analytics -->
